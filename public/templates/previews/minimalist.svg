<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgMin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f4f4f5"/>
    </linearGradient>
    <linearGradient id="accentMin" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#eab308"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgMin)"/>

  <!-- Center Column (max 400px, centered) -->
  <g transform="translate(200, 300)">
    <!-- Avatar -->
    <circle cy="-180" cx="0" r="40" fill="#e4e4e7" stroke="url(#accentMin)" stroke-width="2"/>
    <text x="0" y="-170" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="24" font-weight="600">JD</text>

    <!-- Name -->
    <text x="0" y="-115" text-anchor="middle" fill="#18181b" font-family="system-ui, sans-serif" font-size="24" font-weight="600" letter-spacing="-0.02em">Jordan Doe</text>

    <!-- Headline -->
    <text x="0" y="-85" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="13" font-weight="500">Product Designer · Building at Unool</text>

    <!-- Bio -->
    <text x="0" y="-40" text-anchor="middle" fill="#18181b" font-family="system-ui, sans-serif" font-size="13" line-height="20" width="320">Designing products that people love. Previously at Stripe, Figma. Write about design systems and craft.</text>

    <!-- LINKS - Pure Pills -->
    <g font-family="system-ui, sans-serif" font-size="15" font-weight="500">
      <!-- Link 1: Portfolio -->
      <g transform="translate(0, 20)">
        <rect x="-200" y="-22" width="400" height="44" rx="9999" fill="#e4e4e7" stroke="#d4d4d8" stroke-width="1"/>
        <circle cx="-184" cy="0" r="16" fill="url(#accentMin)"/>
        <text x="-184" y="5" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">P</text>
        <text x="-150" y="5" text-anchor="middle" fill="#18181b" font-weight="500">Portfolio</text>
        <text x="184" y="5" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="16">→</text>
      </g>

      <!-- Link 2: GitHub -->
      <g transform="translate(0, 80)">
        <rect x="-200" y="-22" width="400" height="44" rx="9999" fill="#e4e4e7" stroke="#d4d4d8" stroke-width="1"/>
        <circle cx="-184" cy="0" r="16" fill="#18181b"/>
        <text x="-184" y="5" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">⌘</text>
        <text x="-150" y="5" text-anchor="middle" fill="#18181b" font-weight="500">GitHub</text>
        <text x="184" y="5" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="16">→</text>
      </g>

      <!-- Link 3: Twitter -->
      <g transform="translate(0, 140)">
        <rect x="-200" y="-22" width="400" height="44" rx="9999" fill="#e4e4e7" stroke="#d4d4d8" stroke-width="1"/>
        <circle cx="-184" cy="0" r="16" fill="#09090b"/>
        <text x="-184" y="5" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">𝕏</text>
        <text x="-150" y="5" text-anchor="middle" fill="#18181b" font-weight="500">Twitter</text>
        <text x="184" y="5" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="16">→</text>
      </g>

      <!-- Link 4: LinkedIn -->
      <g transform="translate(0, 200)">
        <rect x="-200" y="-22" width="400" height="44" rx="9999" fill="#e4e4e7" stroke="#d4d4d8" stroke-width="1"/>
        <circle cx="-184" cy="0" r="16" fill="#0a66c2"/>
        <text x="-184" y="5" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="13" font-weight="600">in</text>
        <text x="-150" y="5" text-anchor="middle" fill="#18181b" font-weight="500">LinkedIn</text>
        <text x="184" y="5" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="16">→</text>
      </g>

      <!-- Link 5: Email -->
      <g transform="translate(0, 260)">
        <rect x="-200" y="-22" width="400" height="44" rx="9999" fill="#e4e4e7" stroke="#d4d4d8" stroke-width="1"/>
        <circle cx="-184" cy="0" r="16" fill="#dc2626"/>
        <text x="-184" y="5" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14">✉️</text>
        <text x="-150" y="5" text-anchor="middle" fill="#18181b" font-weight="500">Email</text>
        <text x="184" y="5" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="16">→</text>
      </g>

      <!-- Link 6: Dribbble -->
      <g transform="translate(0, 320)">
        <rect x="-200" y="-22" width="400" height="44" rx="9999" fill="#e4e4e7" stroke="#d4d4d8" stroke-width="1"/>
        <circle cx="-184" cy="0" r="16" fill="#ea4c89"/>
        <text x="-184" y="5" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="14" font-weight="600">D</text>
        <text x="-150" y="5" text-anchor="middle" fill="#18181b" font-weight="500">Dribbble</text>
        <text x="184" y="5" text-anchor="middle" fill="#eab308" font-family="system-ui, sans-serif" font-size="16">→</text>
      </g>
    </g>

    <!-- Proof Points - Minimal Badges -->
    <g transform="translate(-190, 385)" font-family="system-ui, sans-serif">
      <g transform="translate(95, 0)">
        <rect x="-45" y="-22" width="90" height="30" rx="15" fill="#fafafa" stroke="#eab30840" stroke-width="1"/>
        <text x="0" y="-8" text-anchor="middle" fill="#eab308" font-family="ui-monospace, monospace" font-size="10" font-weight="500">50 posts</text>
      </g>
      <g transform="translate(285, 0)">
        <rect x="-45" y="-22" width="90" height="30" rx="15" fill="#fafafa" stroke="#eab30840" stroke-width="1"/>
        <text x="0" y="-8" text-anchor="middle" fill="#eab308" font-family="ui-monospace, monospace" font-size="10" font-weight="500">12k views</text>
      </g>
      <g transform="translate(95, 40)">
        <rect x="-45" y="-22" width="90" height="30" rx="15" fill="#fafafa" stroke="#eab30840" stroke-width="1"/>
        <text x="0" y="-8" text-anchor="middle" fill="#eab308" font-family="ui-monospace, monospace" font-size="10" font-weight="500">3 projects</text>
      </g>
      <g transform="translate(285, 40)">
        <rect x="-45" y="-22" width="90" height="30" rx="15" fill="#fafafa" stroke="#eab30840" stroke-width="1"/>
        <text x="0" y="-8" text-anchor="middle" fill="#eab308" font-family="ui-monospace, monospace" font-size="10" font-weight="500">5 awards</text>
      </g>
    </g>

    <!-- Subdomain -->
    <text x="0" y="460" text-anchor="middle" fill="#71717a" font-family="ui-monospace, monospace" font-size="10" letter-spacing="0.05em">jordandoe.unool.co</text>
  </g>

  <!-- Hover state indicator (subtle) -->
  <g opacity="0.15">
    <rect x="100" y="320" width="200" height="44" rx="9999" fill="url(#accentMin)"/>
    <rect x="100" y="380" width="200" height="44" rx="9999" fill="url(#accentMin)"/>
  </g>
</svg>