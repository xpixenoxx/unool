<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="cube-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Neutral Industrial Spatial Canvas -->
  <rect width="400" height="600" fill="#d9d6cc"/>

  <!-- 3D Perspective Isometric Cube Group -->
  <g transform="translate(48, 60)" filter="url(#cube-shadow)">
    <!-- Main Face 1: Profile (Front-facing panel) -->
    <rect x="0" y="0" width="304" height="420" rx="24" fill="#f2efe6"/>

    <!-- Circular Avatar -->
    <circle cx="152" cy="80" r="46" fill="#1c1c1a"/>
    <text x="152" y="94" font-family="'Helvetica Neue', sans-serif" font-size="28" font-weight="800" fill="#e8c13c" text-anchor="middle">AR</text>

    <!-- Identity Headline -->
    <text x="152" y="165" font-family="'Helvetica Neue', sans-serif" font-size="30" font-weight="800" fill="#1c1c1a" letter-spacing="-1" text-anchor="middle">Aarav Rao</text>
    <text x="152" y="188" font-family="'Helvetica Neue', sans-serif" font-size="13" font-weight="700" fill="#1c1c1a" opacity="0.75" text-anchor="middle">Founder &amp; Creator</text>

    <!-- Bio Summary -->
    <rect x="36" y="210" width="232" height="7" rx="3.5" fill="#1c1c1a" opacity="0.18"/>
    <rect x="36" y="224" width="200" height="7" rx="3.5" fill="#1c1c1a" opacity="0.18"/>
    <rect x="36" y="238" width="160" height="7" rx="3.5" fill="#1c1c1a" opacity="0.18"/>

    <!-- Open To Tags -->
    <g transform="translate(48, 270)">
      <rect x="0" y="0" width="96" height="24" rx="12" fill="#1c1c1a" opacity="0.08"/>
      <text x="48" y="16" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="700" fill="#1c1c1a" text-anchor="middle">ADVISORY</text>

      <rect x="108" y="0" width="100" height="24" rx="12" fill="#1c1c1a" opacity="0.08"/>
      <text x="158" y="16" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="700" fill="#1c1c1a" text-anchor="middle">INVESTING</text>
    </g>

    <!-- 3D Face Hint Footer -->
    <g transform="translate(24, 380)">
      <text x="0" y="0" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="800" fill="#1c1c1a" opacity="0.4" letter-spacing="1">01 / 04 PROFILE</text>
      <text x="256" y="0" font-family="'Helvetica Neue', sans-serif" font-size="10" font-weight="800" fill="#1c1c1a" opacity="0.4" text-anchor="end">KINETIC 3D &rarr;</text>
    </g>
  </g>

  <!-- Left/Right Chevrons -->
  <circle cx="28" cy="270" r="16" fill="#ffffff" opacity="0.85"/>
  <path d="M31 264 L25 270 L31 276" stroke="#1c1c1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <circle cx="372" cy="270" r="16" fill="#ffffff" opacity="0.85"/>
  <path d="M369 264 L375 270 L369 276" stroke="#1c1c1a" stroke-width="2.5" fill="none" stroke-linecap="round"/>

  <!-- Spatial Pill Tabs Selector -->
  <g transform="translate(36, 516)">
    <!-- Tab 1 Active -->
    <rect x="0" y="0" width="76" height="34" rx="17" fill="#1c1c1a"/>
    <text x="38" y="21" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle">Profile</text>

    <!-- Tab 2 -->
    <rect x="84" y="0" width="76" height="34" rx="17" fill="#ffffff" opacity="0.75"/>
    <text x="122" y="21" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="700" fill="#1c1c1a" text-anchor="middle">Links</text>

    <!-- Tab 3 -->
    <rect x="168" y="0" width="76" height="34" rx="17" fill="#ffffff" opacity="0.75"/>
    <text x="206" y="21" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="700" fill="#1c1c1a" text-anchor="middle">Services</text>

    <!-- Tab 4 -->
    <rect x="252" y="0" width="76" height="34" rx="17" fill="#ffffff" opacity="0.75"/>
    <text x="290" y="21" font-family="'Helvetica Neue', sans-serif" font-size="11" font-weight="700" fill="#1c1c1a" text-anchor="middle">Contact</text>
  </g>
</svg>
