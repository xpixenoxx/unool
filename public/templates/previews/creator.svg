<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgCreator" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fdf4ff"/>
      <stop offset="50%" style="stop-color:#faf0ff"/>
      <stop offset="100%" style="stop-color:#f5e6ff"/>
    </linearGradient>
    <linearGradient id="accentCreator" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ec4899"/>
      <stop offset="50%" style="stop-color:#a855f7"/>
      <stop offset="100%" style="stop-color:#0ea5e9"/>
    </linearGradient>
    <linearGradient id="cardCreator" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fafafa"/>
    </linearGradient>
    <radialGradient id="blob1" cx="30%" cy="30%" r="80%">
      <stop offset="0%" style="stop-color:#ec489920"/>
      <stop offset="100%" style="stop-color:#ec489900"/>
    </radialGradient>
    <radialGradient id="blob2" cx="70%" cy="70%" r="80%">
      <stop offset="0%" style="stop-color:#a855f720"/>
      <stop offset="100%" style="stop-color:#a855f700"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgCreator)"/>

  <!-- Morphing blobs -->
  <ellipse cx="80" cy="120" rx="120" ry="80" fill="url(#blob1)" filter="url(#blur)"/>
  <ellipse cx="320" cy="480" rx="140" ry="100" fill="url(#blob2)" filter="url(#blur)"/>

  <!-- Orbital particles (dots) -->
  <g fill="url(#accentCreator)" opacity="0.3">
    <circle cx="50" cy="50" r="2"/>
    <circle cx="350" cy="80" r="1.5"/>
    <circle cx="30" cy="300" r="2.5"/>
    <circle cx="370" cy="280" r="1.5"/>
    <circle cx="50" cy="520" r="2"/>
    <circle cx="350" cy="550" r="2.5"/>
    <circle cx="200" cy="30" r="1.5"/>
    <circle cx="100" cy="450" r="2"/>
    <circle cx="280" cy="580" r="1.5"/>
    <circle cx="150" cy="180" r="2"/>
  </g>

  <!-- Header: Avatar + Name + Stats -->
  <g transform="translate(20, 20)">
    <!-- Avatar with glow -->
    <ellipse cx="35" cy="35" rx="42" ry="28" fill="#ec489915" filter="url(#blur)"/>
    <circle cx="35" cy="35" r="35" fill="#fce7f3" stroke="url(#accentCreator)" stroke-width="3"/>
    <text x="35" y="43" text-anchor="middle" fill="#be185d" font-family="system-ui, sans-serif" font-size="20" font-weight="700">MJ</text>

    <!-- Name & Headline -->
    <text x="85" y="28" text-anchor="start" fill="#111827" font-family="system-ui, sans-serif" font-size="20" font-weight="700">Maya Johnson</text>
    <text x="85" y="50" text-anchor="start" fill="#ec4899" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Content Creator · 2.4M followers</text>

    <!-- Stats row -->
    <g font-family="ui-monospace, monospace" font-size="11" font-weight="600">
      <text x="85" y="70" fill="#ec4899">2.4M</text>
      <text x="115" y="70" fill="#9ca3af" font-size="11">Followers</text>
      <text x="185" y="70" fill="#a855f7">18.2M</text>
      <text x="220" y="70" fill="#9ca3af" font-size="11">Likes</text>
      <text x="290" y="70" fill="#0ea5e9">847K</text>
      <text x="315" y="70" fill="#9ca3af" font-size="11">Views</text>
    </g>
  </g>

  <!-- Engagement Ring Progress -->
  <g transform="translate(200, 110)">
    <circle cx="0" cy="0" r="40" fill="none" stroke="#f3f4f6" stroke-width="6"/>
    <circle cx="0" cy="0" r="40" fill="none" stroke="url(#accentCreator)" stroke-width="6" stroke-linecap="round" stroke-dasharray="251" stroke-dashoffset="50" transform="rotate(-90)"/>
    <text x="0" y="4" text-anchor="middle" fill="#111827" font-family="ui-monospace, monospace" font-size="14" font-weight="700">8.2%</text>
    <text x="0" y="18" text-anchor="middle" fill="#9ca3af" font-family="system-ui, sans-serif" font-size="9">Engagement</text>
  </g>

  <!-- Bio Card -->
  <rect x="20" y="130" width="360" height="70" rx="14" fill="url(#cardCreator)" stroke="#f3f4f6" stroke-width="1"/>
  <text x="40" y="158" fill="#111827" font-family="system-ui, sans-serif" font-size="13" line-height="20" width="320">Creating aesthetic content for the modern creative. 🎨 Fashion • 🎬 Lifestyle • 📸 Photography. DM for collabs!</text>

  <!-- Feed Items (Magnetic Cards) -->
  <g>
    <!-- Feed Item 1 -->
    <g filter="url(#shadow)">
      <defs>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#ec4899" flood-opacity="0.15"/>
        </filter>
      </defs>
      <rect x="20" y="215" width="360" height="95" rx="16" fill="url(#cardCreator)" stroke="#f3f4f6" stroke-width="1"/>
      <circle cx="45" cy="250" r="18" fill="#ec4899" opacity="0.15"/>
      <text x="45" y="255" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="16">📸</text>
      <text x="75" y="240" fill="#111827" font-family="system-ui, sans-serif" font-size="14" font-weight="600">New Preset Drop!</text>
      <text x="75" y="258" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">My Lightroom presets are finally here. 15 looks for that perfect aesthetic.</text>
      <!-- Stats on card -->
      <g font-family="ui-monospace, monospace" font-size="10" font-weight="600" transform="translate(280, 240)">
        <text x="0" y="0" fill="#ec4899"><tspan>♥</tspan> 12.4K</text>
        <text x="0" y="16" fill="#0ea5e9"><tspan>💬</tspan> 892</text>
        <text x="0" y="32" fill="#a855f7"><tspan>🔁</tspan> 1.2K</text>
      </g>
      <text x="360" y="260" text-anchor="end" fill="#ec4899" font-family="system-ui, sans-serif" font-size="16">→</text>
    </g>

    <!-- Feed Item 2 -->
    <g filter="url(#shadow)">
      <rect x="20" y="325" width="360" height="95" rx="16" fill="url(#cardCreator)" stroke="#f3f4f6" stroke-width="1"/>
      <circle cx="45" cy="360" r="18" fill="#a855f7" opacity="0.15"/>
      <text x="45" y="365" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-size="16">🎬</text>
      <text x="75" y="350" fill="#111827" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Behind the Scenes</text>
      <text x="75" y="368" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">How I shot the campaign for @nike. Full breakdown on YouTube.</text>
      <g font-family="ui-monospace, monospace" font-size="10" font-weight="600" transform="translate(280, 350)">
        <text x="0" y="0" fill="#ec4899"><tspan>♥</tspan> 8.7K</text>
        <text x="0" y="16" fill="#0ea5e9"><tspan>💬</tspan> 567</text>
        <text x="0" y="32" fill="#a855f7"><tspan>🔁</tspan> 892</text>
      </g>
      <text x="360" y="370" text-anchor="end" fill="#a855f7" font-family="system-ui, sans-serif" font-size="16">→</text>
    </g>

    <!-- Feed Item 3 -->
    <g filter="url(#shadow)">
      <rect x="20" y="435" width="360" height="95" rx="16" fill="url(#cardCreator)" stroke="#f3f4f6" stroke-width="1"/>
      <circle cx="45" cy="470" r="18" fill="#0ea5e9" opacity="0.15"/>
      <text x="45" y="475" text-anchor="middle" fill="#0ea5e9" font-family="system-ui, sans-serif" font-size="16">🛍️</text>
      <text x="75" y="460" fill="#111827" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Shop My Closet</text>
      <text x="75" y="478" fill="#6b7280" font-family="system-ui, sans-serif" font-size="12">Curated pieces from my wardrobe. Limited quantities — grab yours!</text>
      <g font-family="ui-monospace, monospace" font-size="10" font-weight="600" transform="translate(280, 460)">
        <text x="0" y="0" fill="#ec4899"><tspan>♥</tspan> 24.1K</text>
        <text x="0" y="16" fill="#0ea5e9"><tspan>💬</tspan> 2.1K</text>
        <text x="0" y="32" fill="#a855f7"><tspan>🔁</tspan> 3.4K</text>
      </g>
      <text x="360" y="480" text-anchor="end" fill="#0ea5e9" font-family="system-ui, sans-serif" font-size="16">→</text>
    </g>
  </g>

  <!-- Media Grid (2x2) -->
  <g>
    <rect x="20" y="545" width="170" height="95" rx="12" fill="#f3f4f6"/>
    <rect x="40" y="560" width="40" height="40" rx="8" fill="#ec489930"/>
    <text x="60" y="588" text-anchor="middle" fill="#ec4899" font-family="system-ui, sans-serif" font-size="20">📷</text>

    <rect x="210" y="545" width="170" height="95" rx="12" fill="#f3f4f6"/>
    <rect x="230" y="560" width="40" height="40" rx="8" fill="#a855f730"/>
    <text x="250" y="588" text-anchor="middle" fill="#a855f7" font-family="system-ui, sans-serif" font-size="20">🎥</text>
  </g>

  <!-- Links Section (pills) -->
  <g transform="translate(20, 200)">
    <!-- Instagram -->
    <rect x="0" y="0" width="110" height="40" rx="20" fill="url(#accentCreator)"/>
    <text x="55" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Instagram</text>

    <!-- TikTok -->
    <rect x="125" y="0" width="110" height="40" rx="20" fill="#000000"/>
    <text x="180" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">TikTok</text>

    <!-- YouTube -->
    <rect x="250" y="0" width="110" height="40" rx="20" fill="#ff0000"/>
    <text x="305" y="25" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="12" font-weight="600">YouTube</text>
  </g>

  <!-- Subdomain -->
  <text x="200" y="595" text-anchor="middle" fill="#d1d5db" font-family="ui-monospace, monospace" font-size="10">mayajohnson.unool.co</text>
</svg>