<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgStudent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fafafa"/>
      <stop offset="100%" style="stop-color:#f4f4f5"/>
    </linearGradient>
    <linearGradient id="accentStudent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#3b82f6"/>
      <stop offset="100%" style="stop-color:#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardStudent" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#fafafa"/>
    </linearGradient>
    <radialGradient id="avatarGlow" cx="50%" cy="30%" r="70%">
      <stop offset="0%" style="stop-color:#3b82f620"/>
      <stop offset="100%" style="stop-color:#3b82f600"/>
    </radialGradient>
    <filter id="shadowStudent" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#3b82f6" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bgStudent)"/>

  <!-- Hero Section: Avatar + Name + Headline -->
  <g transform="translate(200, 120)">
    <!-- Avatar Glow -->
    <ellipse cx="0" cy="-40" rx="65" ry="50" fill="url(#avatarGlow)" filter="url(#shadowStudent)"/>

    <!-- Avatar Ring -->
    <circle cx="0" cy="-40" r="48" fill="none" stroke="url(#accentStudent)" stroke-width="4"/>

    <!-- Avatar -->
    <circle cx="0" cy="-40" r="44" fill="#dbeafe"/>
    <text x="0" cy="-30" text-anchor="middle" fill="#1d4ed8" font-family="system-ui, sans-serif" font-size="28" font-weight="700">SC</text>

    <!-- Name -->
    <text x="0" y="30" text-anchor="middle" fill="#18181b" font-family="system-ui, sans-serif" font-size="26" font-weight="700" letter-spacing="-0.02em">Sarah Chen</text>

    <!-- Headline -->
    <text x="0" y="60" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="15" font-weight="500">Computer Science Senior · UC Berkeley</text>

    <!-- Company/Internship -->
    <text x="0" y="84" text-anchor="middle" fill="#71717a" font-family="system-ui, sans-serif" font-size="13">Software Engineering Intern @ Stripe (Summer 2024)</text>
  </g>

  <!-- Bio Card -->
  <rect x="40" y="250" width="320" height="90" rx="16" fill="url(#cardStudent)" stroke="#e4e4e7" stroke-width="1" filter="url(#shadowStudent)"/>
  <text x="60" y="285" fill="#18181b" font-family="system-ui, sans-serif" font-size="14" line-height="22" width="280">Passionate about building scalable systems and developer tools. Open source contributor. Currently exploring distributed systems, Rust, and AI/ML infrastructure.</text>

  <!-- Links Section (Clean Underline Style) -->
  <g font-family="system-ui, sans-serif" font-size="15">
    <!-- Link 1: GitHub -->
    <g transform="translate(40, 365)" filter="url(#shadowStudent)">
      <rect x="0" y="0" width="320" height="52" rx="10" fill="url(#cardStudent)" stroke="#e4e4e7" stroke-width="1"/>
      <circle cx="35" cy="26" r="20" fill="#18181b"/>
      <text x="35" y="32" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">⌘</text>
      <text x="70" y="22" fill="#18181b" font-size="17" font-weight="500">GitHub</text>
      <text x="70" y="42" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">github.com/sarahchen</text>
      <text x="340" y="26" text-anchor="end" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="20">→</text>
    </g>

    <!-- Link 2: LinkedIn -->
    <g transform="translate(40, 430)" filter="url(#shadowStudent)">
      <rect x="0" y="0" width="320" height="52" rx="10" fill="url(#cardStudent)" stroke="#e4e4e7" stroke-width="1"/>
      <circle cx="35" cy="26" r="20" fill="#0a66c2"/>
      <text x="35" y="32" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16" font-weight="600">in</text>
      <text x="70" y="22" fill="#18181b" font-size="17" font-weight="500">LinkedIn</text>
      <text x="70" y="42" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">linkedin.com/in/sarahchen</text>
      <text x="340" y="26" text-anchor="end" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="20">→</text>
    </g>

    <!-- Link 3: Portfolio -->
    <g transform="translate(40, 495)" filter="url(#shadowStudent)">
      <rect x="0" y="0" width="320" height="52" rx="10" fill="url(#cardStudent)" stroke="#e4e4e7" stroke-width="1"/>
      <circle cx="35" cy="26" r="20" fill="#059669"/>
      <text x="35" y="31" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="16">🌐</text>
      <text x="70" y="22" fill="#18181b" font-size="17" font-weight="500">Portfolio</text>
      <text x="70" y="42" fill="#71717a" font-family="ui-monospace, monospace" font-size="11">sarahchen.dev</text>
      <text x="340" y="26" text-anchor="end" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="20">→</text>
    </g>
  </g>

  <!-- Proof Points - Simple List -->
  <g transform="translate(40, 250)" font-family="system-ui, sans-serif">
    <!-- Proof 1 -->
    <g transform="translate(0, 565)" filter="url(#shadowStudent)">
      <rect x="0" y="0" width="320" height="56" rx="12" fill="url(#cardStudent)" stroke="#e4e4e7" stroke-width="1"/>
      <circle cx="30" cy="28" r="18" fill="#3b82f620"/>
      <text x="30" y="33" text-anchor="middle" fill="#3b82f6" font-family="system-ui, sans-serif" font-size="16">📦</text>
      <text x="65" y="20" fill="#18181b" font-size="14" font-weight="600">Repositories</text>
      <text x="65" y="40" fill="#71717a" font-size="13">42 public repos · 1.2k stars</text>
    </g>

    <!-- Proof 2 -->
    <g transform="translate(0, 630)" filter="url(#shadowStudent)">
      <rect x="0" y="0" width="320" height="56" rx="12" fill="url(#cardStudent)" stroke="#e4e4e7" stroke-width="1"/>
      <circle cx="30" cy="28" r="18" fill="#f59e0b20"/>
      <text x="30" y="33" text-anchor="middle" fill="#f59e0b" font-family="system-ui, sans-serif" font-size="16">⭐</text>
      <text x="65" y="20" fill="#18181b" font-size="14" font-weight="600">Total Stars</text>
      <text x="65" y="40" fill="#71717a" font-size="13">1.2k stars across projects</text>
    </g>

    <!-- Proof 3 -->
    <g transform="translate(0, 695)" filter="url(#shadowStudent)">
      <rect x="0" y="0" width="320" height="56" rx="12" fill="url(#cardStudent)" stroke="#e4e4e7" stroke-width="1"/>
      <circle cx="30" cy="28" r="18" fill="#10b98120"/>
      <text x="30" y="33" text-anchor="middle" fill="#10b981" font-family="system-ui, sans-serif" font-size="16">👥</text>
      <text x="65" y="20" fill="#18181b" font-size="14" font-weight="600">Contributions</text>
      <text x="65" y="40" fill="#71717a" font-size="13">365 days streak · 50+ PRs merged</text>
    </g>
  </g>

  <!-- Subdomain -->
  <text x="200" y="595" text-anchor="middle" fill="#71717a" font-family="ui-monospace, monospace" font-size="11" letter-spacing="0.05em">sarahchen.unool.co</text>
</svg>