<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="metro-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Warm Sand Cream Background -->
  <rect width="400" height="600" fill="#f4f1ea"/>

  <!-- Metro Map Graphic Content -->
  <g transform="translate(24, 28)">
    <!-- Header -->
    <g transform="translate(0, 0)">
      <circle cx="40" cy="40" r="36" fill="#1b1b1b" stroke="#e5452b" stroke-width="6"/>
      <text x="40" y="48" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="20" fill="#ffffff" text-anchor="middle">PX</text>

      <circle cx="106" cy="22" r="14" fill="#e5452b"/>
      <text x="106" y="27" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="12" fill="#ffffff" text-anchor="middle">01</text>

      <text x="106" y="52" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="22" fill="#1b1b1b">Pixenox</text>
      <text x="106" y="70" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="12" fill="#e5452b">Founder &amp; Creator</text>
    </g>

    <!-- Action Buttons -->
    <g transform="translate(0, 96)">
      <rect x="0" y="0" width="60" height="24" rx="12" fill="#1b1b1b"/>
      <text x="30" y="16" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">CALL</text>

      <rect x="68" y="0" width="64" height="24" rx="12" fill="#1b1b1b"/>
      <text x="100" y="16" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">EMAIL</text>

      <rect x="140" y="0" width="108" height="24" rx="12" fill="#e5452b"/>
      <text x="194" y="16" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">SAVE CONTACT</text>
    </g>

    <!-- Section Title: STATIONS -->
    <text x="0" y="152" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="11" fill="#1b1b1b" opacity="0.6" letter-spacing="3">STATIONS</text>

    <!-- Vertical Red Track Line -->
    <rect x="18" y="172" width="10" height="280" rx="5" fill="#e5452b"/>

    <!-- Station 1 -->
    <g transform="translate(48, 172)" filter="url(#metro-shadow)">
      <circle cx="-25" cy="24" r="11" fill="#ffffff" stroke="#1b1b1b" stroke-width="4"/>
      <rect x="0" y="0" width="300" height="48" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.5"/>
      <rect x="10" y="13" width="22" height="22" rx="4" fill="#1b1b1b"/>
      <text x="21" y="28" font-family="monospace" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">01</text>
      <text x="42" y="29" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="14" fill="#1b1b1b">Official Website</text>
      <text x="282" y="29" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="14" fill="#e5452b" text-anchor="end">→</text>
    </g>

    <!-- Station 2 -->
    <g transform="translate(48, 236)" filter="url(#metro-shadow)">
      <circle cx="-25" cy="24" r="11" fill="#e5452b" stroke="#1b1b1b" stroke-width="4"/>
      <rect x="0" y="0" width="300" height="48" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.5"/>
      <rect x="10" y="13" width="22" height="22" rx="4" fill="#1b1b1b"/>
      <text x="21" y="28" font-family="monospace" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">02</text>
      <text x="42" y="29" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="14" fill="#1b1b1b">Selected Portfolio</text>
      <text x="282" y="29" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="14" fill="#e5452b" text-anchor="end">→</text>
    </g>

    <!-- Station 3 -->
    <g transform="translate(48, 300)" filter="url(#metro-shadow)">
      <circle cx="-25" cy="24" r="11" fill="#ffffff" stroke="#1b1b1b" stroke-width="4"/>
      <rect x="0" y="0" width="300" height="48" rx="8" fill="#ffffff" stroke="#1b1b1b" stroke-width="2.5"/>
      <rect x="10" y="13" width="22" height="22" rx="4" fill="#1b1b1b"/>
      <text x="21" y="28" font-family="monospace" font-weight="700" font-size="10" fill="#ffffff" text-anchor="middle">03</text>
      <text x="42" y="29" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="14" fill="#1b1b1b">Direct Dispatch</text>
      <text x="282" y="29" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="14" fill="#e5452b" text-anchor="end">→</text>
    </g>

    <!-- Section Title: FACILITIES -->
    <text x="0" y="485" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="11" fill="#1b1b1b" opacity="0.6" letter-spacing="3">FACILITIES</text>

    <!-- Facilities Badges -->
    <g transform="translate(0, 498)">
      <rect x="0" y="0" width="100" height="26" rx="6" fill="#1b1b1b"/>
      <text x="50" y="17" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">Brand Identity</text>

      <rect x="108" y="0" width="88" height="26" rx="6" fill="#1b1b1b"/>
      <text x="152" y="17" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">Web Design</text>

      <rect x="204" y="0" width="94" height="26" rx="6" fill="#1b1b1b"/>
      <text x="251" y="17" font-family="'M PLUS 1p', sans-serif" font-weight="800" font-size="10" fill="#ffffff" text-anchor="middle">Consulting</text>
    </g>
  </g>
</svg>

