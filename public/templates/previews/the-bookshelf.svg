<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="bs-shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Parchment Linen Background -->
  <rect width="400" height="600" fill="#d9c7bd"/>

  <!-- Header Dossier -->
  <g transform="translate(24, 28)">
    <!-- Leather Framed Portrait -->
    <rect x="0" y="0" width="80" height="100" rx="3" fill="#efe6dc" stroke="#3a2a1c" stroke-width="7" filter="url(#bs-shadow)"/>
    <text x="40" y="58" font-family="'Iowan Old Style', serif" font-size="24" font-weight="600" fill="#6b4a32" text-anchor="middle">AR</text>

    <!-- Meta Details -->
    <text x="96" y="32" font-family="'Iowan Old Style', serif" font-size="24" font-weight="400" fill="#2b2118">Aarav Rao</text>
    <text x="96" y="52" font-family="'Avenir Next', sans-serif" font-size="12" font-style="italic" fill="#6b4a32">Brand Designer</text>
    <rect x="96" y="64" width="220" height="6" rx="3" fill="#2b2118" opacity="0.18"/>
    <rect x="96" y="76" width="170" height="6" rx="3" fill="#2b2118" opacity="0.18"/>
  </g>

  <!-- Bookshelf Section -->
  <g transform="translate(24, 150)">
    <text x="0" y="20" font-family="'Avenir Next', sans-serif" font-size="10" font-weight="700" fill="#6b4a32" letter-spacing="2">ON THE SHELF</text>

    <!-- Books on Shelf -->
    <g transform="translate(0, 30)">
      <!-- Book 1 (Burgundy) -->
      <rect x="8" y="20" width="40" height="180" rx="3" fill="#7a2e2e" filter="url(#bs-shadow)"/>
      <line x1="8" y1="52" x2="48" y2="52" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <line x1="8" y1="168" x2="48" y2="168" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <text x="28" y="115" font-family="'Iowan Old Style', serif" font-size="11" fill="#f4ead7" transform="rotate(-90, 28, 115)" text-anchor="middle">LinkedIn</text>

      <!-- Book 2 (Hunter Green - Lifted) -->
      <rect x="56" y="4" width="40" height="196" rx="3" fill="#2e4a3f" filter="url(#bs-shadow)"/>
      <line x1="56" y1="36" x2="96" y2="36" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <line x1="56" y1="172" x2="96" y2="172" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <text x="76" y="105" font-family="'Iowan Old Style', serif" font-size="11" fill="#f4ead7" transform="rotate(-90, 76, 105)" text-anchor="middle">YouTube</text>
      <!-- Hover Badge -->
      <rect x="52" y="-14" width="48" height="15" rx="7.5" fill="#2b2118"/>
      <text x="76" y="-3" font-family="'Avenir Next', sans-serif" font-size="8" font-weight="700" fill="#f4ead7" text-anchor="middle">WATCH</text>

      <!-- Book 3 (Ochre Gold) -->
      <rect x="104" y="38" width="40" height="162" rx="3" fill="#c98f2b" filter="url(#bs-shadow)"/>
      <line x1="104" y1="68" x2="144" y2="68" stroke="#2b2118" stroke-width="2" opacity="0.5"/>
      <line x1="104" y1="168" x2="144" y2="168" stroke="#2b2118" stroke-width="2" opacity="0.5"/>
      <text x="124" y="122" font-family="'Iowan Old Style', serif" font-size="11" fill="#2b2118" transform="rotate(-90, 124, 122)" text-anchor="middle">Instagram</text>

      <!-- Book 4 (Navy) -->
      <rect x="152" y="44" width="40" height="156" rx="3" fill="#1f3550" filter="url(#bs-shadow)"/>
      <line x1="152" y1="74" x2="192" y2="74" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <line x1="152" y1="168" x2="192" y2="168" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <text x="172" y="126" font-family="'Iowan Old Style', serif" font-size="11" fill="#f4ead7" transform="rotate(-90, 172, 126)" text-anchor="middle">WhatsApp</text>

      <!-- Book 5 (Leather Walnut) -->
      <rect x="200" y="14" width="40" height="186" rx="3" fill="#6b4a32" filter="url(#bs-shadow)"/>
      <line x1="200" y1="46" x2="240" y2="46" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <line x1="200" y1="168" x2="240" y2="168" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <text x="220" y="112" font-family="'Iowan Old Style', serif" font-size="11" fill="#f4ead7" transform="rotate(-90, 220, 112)" text-anchor="middle">Portfolio</text>

      <!-- Book 6 (Slate Teal) -->
      <rect x="248" y="28" width="40" height="172" rx="3" fill="#4b5d67" filter="url(#bs-shadow)"/>
      <line x1="248" y1="60" x2="288" y2="60" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <line x1="248" y1="168" x2="288" y2="168" stroke="#f4ead7" stroke-width="2" opacity="0.6"/>
      <text x="268" y="118" font-family="'Iowan Old Style', serif" font-size="11" fill="#f4ead7" transform="rotate(-90, 268, 118)" text-anchor="middle">Booking</text>

      <!-- Book 7 (Ash Grey) -->
      <rect x="296" y="18" width="40" height="182" rx="3" fill="#8a8f98" filter="url(#bs-shadow)"/>
      <line x1="296" y1="50" x2="336" y2="50" stroke="#1d1d1d" stroke-width="2" opacity="0.5"/>
      <line x1="296" y1="168" x2="336" y2="168" stroke="#1d1d1d" stroke-width="2" opacity="0.5"/>
      <text x="316" y="115" font-family="'Iowan Old Style', serif" font-size="11" fill="#1d1d1d" transform="rotate(-90, 316, 115)" text-anchor="middle">Resume</text>

      <!-- Heavy Wooden Shelf Base -->
      <rect x="0" y="200" width="352" height="14" rx="2" fill="#6b4a32" filter="url(#bs-shadow)"/>
    </g>
  </g>

  <!-- Embossed Services Plaque -->
  <g transform="translate(24, 400)">
    <rect x="0" y="0" width="352" height="114" rx="8" fill="#2b2118" stroke="#b8975a" stroke-width="2" filter="url(#bs-shadow)"/>
    <text x="18" y="24" font-family="'Avenir Next', sans-serif" font-size="9" font-weight="700" fill="#b8975a" letter-spacing="2">SERVICES &amp; ARCHIVE</text>
    <!-- Row 1 -->
    <text x="18" y="52" font-family="'Iowan Old Style', serif" font-size="14" fill="#e8d9b5">Brand Identity</text>
    <text x="334" y="52" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="600" fill="#d9b86c" text-anchor="end">From $800</text>
    <line x1="18" y1="62" x2="334" y2="62" stroke="#b8975a" stroke-width="1" opacity="0.25"/>
    <!-- Row 2 -->
    <text x="18" y="86" font-family="'Iowan Old Style', serif" font-size="14" fill="#e8d9b5">Editorial Publishing</text>
    <text x="334" y="86" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="600" fill="#d9b86c" text-anchor="end">From $1,200</text>
  </g>

  <!-- Action Dock -->
  <g transform="translate(24, 534)">
    <rect x="0" y="0" width="80" height="36" rx="6" fill="#6b4a32"/>
    <text x="40" y="23" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="600" fill="#f4ead7" text-anchor="middle">Call</text>

    <rect x="90" y="0" width="80" height="36" rx="6" fill="#6b4a32"/>
    <text x="130" y="23" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="600" fill="#f4ead7" text-anchor="middle">Email</text>

    <rect x="180" y="0" width="80" height="36" rx="6" fill="#6b4a32"/>
    <text x="220" y="23" font-family="'Avenir Next', sans-serif" font-size="11" font-weight="600" fill="#f4ead7" text-anchor="middle">WhatsApp</text>

    <rect x="270" y="0" width="82" height="36" rx="6" fill="#2b2118" stroke="#b8975a" stroke-width="1"/>
    <text x="311" y="23" font-family="'Avenir Next', sans-serif" font-size="10" font-weight="600" fill="#f4ead7" text-anchor="middle">Save Card</text>
  </g>
</svg>

