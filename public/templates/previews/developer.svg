    <text x="0" y="18" fill="#60a5fa"><tspan>"bio"</tspan><tspan fill="#e5e7eb">: "</tspan><tspan fill="#a5f3fc">Building tools</tspan><tspan fill="#e5e7eb"> that make </tspan><tspan fill="#22d3ee">developers</tspan><tspan fill="#e5e7eb"> happy.</tspan></text>
