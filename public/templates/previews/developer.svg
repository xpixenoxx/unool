<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgDev" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#060a0d"/>
      <stop offset="100%" style="stop-color:#0a1218"/>
    </linearGradient>
    <linearGradient id="accentDev" x1="0%" y1="0%" x2="100%" y2="0%">
