    <text x="202" y="22" text-anchor="middle" fill="white" font-family="system-ui, sans-serif" font-size="11" font-weight="700">𝕏</text>
    <text x="230" y="21" fill="#e5e7eb" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Twitter</text>
