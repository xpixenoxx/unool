<svg width="400" height="600" viewBox="0 0 400 600" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f8fafc"/>
      <stop offset="100%" style="stop-color:#f1f5f9"/>
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#10b981"/>
      <stop offset="100%" style="stop-color:#059669"/>
    </linearGradient>
    <linearGradient id="accent2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f59e0b"/>
      <stop offset="100%" style="stop-color:#d97706"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="600" fill="url(#bg1)"/>
  <circle cx="200" cy="150" r="180" fill="url(#accent1)" opacity="0.15" filter="url(#glow)"/>
  <circle cx="300" cy="500" r="120" fill="url(#accent2)" opacity="0.1"/>

  <!-- Avatar -->
  <circle cx="200" cy="110" r="50" fill="#e2e8f0" filter="url(#glow)"/>
  <circle cx="200" cy="110" r="48" fill="url(#accent1)" filter="url(#glow)"/>
  <text x="200" y="122" text-anchor="middle" font-family="system-ui, sans-serif" font-size="32" font-weight="700" fill="white">N</text>

  <!-- Name -->
  <text x="200" y="195" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" font-weight="700" fill="#0f172a">Nature Conservancy</text>
  <text x="200" y="225" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" fill="#64748b">Protecting nature. Sustaining life.</text>

  <!-- Mission Card -->
  <rect x="40" y="250" width="320" height="80" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="40" y="250" width="4" height="80" rx="2" fill="url(#accent1)"/>
  <text x="65" y="275" text-anchor="start" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10b981" letter-spacing="0.1em">OUR MISSION</text>
  <text x="65" y="305" text-anchor="start" font-family="system-ui, sans-serif" font-size="13" fill="#334155" width="280">We protect the lands and waters on which all life depends.</text>

  <!-- Impact Metrics -->
  <g font-family="system-ui, sans-serif">
    <rect x="40" y="350" width="100" height="70" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="90" y="370" text-anchor="middle" font-size="10" font-weight="700" fill="#10b981" letter-spacing="0.1em">ACRES</text>
    <text x="90" y="398" text-anchor="middle" font-size="20" font-weight="800" fill="#10b981">125M+</text>

    <rect x="150" y="350" width="100" height="70" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="200" y="370" text-anchor="middle" font-size="10" font-weight="700" fill="#10b981" letter-spacing="0.1em">PROJECTS</text>
    <text x="200" y="398" text-anchor="middle" font-size="20" font-weight="800" fill="#10b981">4.2k</text>

    <rect x="260" y="350" width="100" height="70" rx="12" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <text x="310" y="370" text-anchor="middle" font-size="10" font-weight="700" fill="#10b981" letter-spacing="0.1em">COUNTRIES</text>
    <text x="310" y="398" text-anchor="middle" font-size="20" font-weight="800" fill="#10b981">76</text>
  </g>

  <!-- Action Buttons -->
  <rect x="40" y="440" width="150" height="48" rx="12" fill="url(#accent1)" filter="url(#glow)"/>
  <text x="115" y="471" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="white">🌱 Donate</text>

  <rect x="210" y="440" width="150" height="48" rx="12" fill="white" stroke="#10b981" stroke-width="2"/>
  <text x="285" y="471" text-anchor="middle" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#10b981">🤝 Volunteer</text>

  <!-- Regular Links -->
  <g font-family="system-ui, sans-serif" font-size="12">
    <rect x="40" y="510" width="320" height="40" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="60" cy="530" r="10" fill="url(#accent1)"/>
    <text x="80" y="535" text-anchor="start" font-weight="600" fill="#0f172a">Our Programs</text>
    <text x="330" y="535" text-anchor="end" fill="#10b981">→</text>

    <rect x="40" y="555" width="320" height="40" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="60" cy="575" r="10" fill="url(#accent2)"/>
    <text x="80" y="580" text-anchor="start" font-weight="600" fill="#0f172a">Annual Report</text>
    <text x="330" y="580" text-anchor="end" fill="#10b981">→</text>
  </g>

  <!-- Partners -->
  <text x="200" y="515" text-anchor="middle" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#10b981" letter-spacing="0.1em">TRUSTED PARTNERS</text>
  <text x="200" y="590" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#10b981" font-family="monospace">nature.org/unool.co</text>
</svg>